# ВРЕМЕННАЯ ЗАГЛУШКА: сайт закрыт от публичного доступа.
#
# GitHub Pages собирает страницы через Jekyll. Этот список говорит ему
# не публиковать ничего: файлы остаются в репозитории нетронутыми,
# но по адресу germanwin.github.io/dofamin-site/ отдаётся 404.
#
# Чтобы снова открыть сайт — удалить этот файл.
# Совсем выключить Pages может только владелец репозитория:
# Settings -> Pages -> Source -> None.
exclude:
  - "*.html"
  - "*.pdf"
  - "*.md"
  - "*.php"
  - "*.txt"
  - "*.xml"
  - assets
